<text x="105" y="812" font-family="Arial" font-size="17" fill="#853b48" font-weight="normal" text-anchor="start">GPIO32 → 1 kΩ resistor → NPN base  |  emitter → common GND  |  collector → buzzer (−)</text>
<text x="105" y="845" font-family="Arial" font-size="16" fill="#853b48" font-weight="normal" text-anchor="start">Buzzer (+) → verified rated supply. Add 10 kΩ base pull-down. Do NOT connect buzzer to GPIO directly.</text>
