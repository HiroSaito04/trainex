<text x="58" y="765" font-family="Arial" font-size="18" fill="#2e4353">All N.O. button terminals must be open at rest, short to GND only when pressed (INPUT_PULLUP).</text>
<text x="58" y="800" font-family="Arial" font-size="18" fill="#b25151">Do NOT use the red (+) rail for buttons. I²C GPIO21/22 are reserved for the future AS5600.</text>
