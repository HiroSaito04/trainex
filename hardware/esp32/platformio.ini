; TRAINEX ESP32-WROOM-32, 30-pin USB-C board
; Build environment esp32dev: bench test, prints every button press to Serial.
; Build environment esp32dev_wifi: secure WebSocket to TRAINEX; requires include/Secrets.h.
[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
build_flags = ${env.build_flags} -DTRAINEX_ENABLE_NETWORK=0

[env:esp32dev_wifi]
build_flags = ${env.build_flags} -DTRAINEX_ENABLE_NETWORK=1
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.3.0
