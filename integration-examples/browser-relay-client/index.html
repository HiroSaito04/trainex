<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRAINEX Relay Pairing Tester</title>
<style>body{font:16px system-ui;max-width:720px;margin:3rem auto;padding:0 1rem;background:#0f172a;color:white}label{display:block;margin-top:18px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #64748b;border-radius:6px;background:#1e293b;color:white}button{margin:16px 8px 12px 0;padding:10px 20px;border:0;border-radius:6px;background:#0d9488;color:white;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word;background:#1e293b;padding:14px;border-radius:6px;min-height:120px}small{color:#cbd5e1}</style>
</head><body>
<h1>TRAINEX Relay Test</h1><p>This page only tests the relay and ESP32 events. It does not control the train simulation engine.</p>
<label>Secure WebSocket endpoint</label><input id="endpoint" placeholder="wss://your-relay.up.railway.app/ws">
<label>Temporary test session ID</label><input id="session" value="trainex_test_01">
<label>Device pairing code</label><input id="code" type="password" autocomplete="off" placeholder="Paste your private pairing code">
<button id="connect">Connect</button><button id="disconnect" disabled>Disconnect</button>
<p>Status: <strong id="status">Disconnected</strong></p><p>Last input:</p><pre id="last">—</pre>
<small>Serve locally at http://localhost:5173. Your relay must allow this origin. Do not put real device tokens here.</small>
<script type="module">
import {connectTrainexRelay} from './trainexRelayClient.js';
let client=null;
const $=id=>document.getElementById(id);
$('connect').onclick=()=>{
 try{
  if(client)client.disconnect();
  client=connectTrainexRelay({
   endpoint:$('endpoint').value.trim(),sessionId:$('session').value.trim(),pairingCode:$('code').value.trim(),
   onStatus:status=>{$('status').textContent=status;$('disconnect').disabled=status==='disconnected';},
   onError:message=>{$('last').textContent='Error: '+message;},
   onInput:msg=>{$('last').textContent=JSON.stringify(msg,null,2);}
  });
  $('disconnect').disabled=false;
 }catch(err){$('last').textContent='Error: '+err.message;}
};
$('disconnect').onclick=()=>{client?.disconnect();client=null;$('disconnect').disabled=true;};
</script></body></html>
